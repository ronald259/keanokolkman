<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bewerken — Keano Kolkman</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
<div id="site-header"></div>
<main id="main"></main>
<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  if (!KKAuth.requireAuth({ adminOnly: true })) { /* redirected */ } else {
    KKHeader.mount("admin");
    KKFooter.mount();
    renderEdit();
  }

  function renderEdit() {
    const id = KKUtil.qs("id");
    const item = KK.byId(id);
    const main = document.getElementById("main");
    if (!item) {
      main.innerHTML = `<section class="container" style="padding-top:160px;"><h1>Item niet gevonden</h1><p><a href="admin.html" class="btn btn--outline">Terug</a></p></section>`;
      return;
    }

    main.innerHTML = `
      <section class="container admin-shell">
        <div class="admin-head">
          <div>
            <span class="eyebrow">Bewerken</span>
            <h1>${KKUtil.escapeHTML(item.title)}</h1>
          </div>
          <a href="admin.html" class="btn btn--outline">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            Terug
          </a>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 320px; gap:24px;">
          <div class="wizard" style="margin:0;">
            <div class="field--row">
              <label class="field">
                <span class="field__label">Titel</span>
                <input id="e-title" type="text" value="${KKUtil.escapeHTML(item.title)}" />
              </label>
              <label class="field">
                <span class="field__label">Type</span>
                <input id="e-type" type="text" value="${KKUtil.escapeHTML(item.type)}" />
              </label>
            </div>
            <label class="field">
              <span class="field__label">Beschrijving</span>
              <textarea id="e-desc">${KKUtil.escapeHTML(item.description)}</textarea>
            </label>
            <div class="field--row">
              <label class="field">
                <span class="field__label">Categorie</span>
                <select id="e-cat">
                  ${Object.entries(CATEGORIES).map(([k,v]) =>
                    `<option value="${k}" ${k===item.category?"selected":""}>${v.label}</option>`).join("")}
                </select>
              </label>
              <label class="field">
                <span class="field__label">Jaar</span>
                <input id="e-year" type="number" value="${item.year}" />
              </label>
            </div>
            <div class="field--row">
              <label class="field">
                <span class="field__label">Duur / formaat</span>
                <input id="e-dur" type="text" value="${KKUtil.escapeHTML(item.duration)}" />
              </label>
              <label class="field">
                <span class="field__label">Vimeo ID</span>
                <input id="e-vimeo" type="text" value="${KKUtil.escapeHTML(item.vimeoId || "")}" />
              </label>
            </div>
            <label class="field">
              <span class="field__label">Tags (komma-gescheiden)</span>
              <input id="e-tags" type="text" value="${(item.tags||[]).join(", ")}" />
            </label>

            <div class="wizard__actions">
              <button class="btn btn--outline" onclick="history.back()">Annuleren</button>
              <div style="display:flex; gap:10px;">
                <button class="btn btn--ghost" onclick="alert('Demo: status omgezet naar concept.')">Verbergen</button>
                <button class="btn btn--neon" onclick="alert('Demo: wijzigingen opgeslagen.'); setTimeout(()=>location.href='admin.html',800);">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>
                  Opslaan
                </button>
              </div>
            </div>
          </div>

          <aside class="detail-aside" style="background:var(--surface);">
            <div class="thumb-preview" style="background-image:url('${item.backdrop}'); margin-bottom:14px;">
              <span class="meta">Huidige thumbnail</span>
            </div>
            <label class="btn btn--outline btn--sm" style="width:100%; justify-content:center;">
              Vervang thumbnail
              <input type="file" accept=".jpg,.jpeg,.png,.webp" style="display:none;" />
            </label>
            <div style="margin-top:16px; font-family:var(--font-mono); font-size:11px; color:var(--text-muted); letter-spacing:.12em; text-transform:uppercase;">Status</div>
            <div style="margin-top:6px;">
              ${item.status==="published"
                ? `<span class="badge badge--pub">Gepubliceerd</span>`
                : `<span class="badge badge--draft">Concept</span>`}
            </div>
            <div style="margin-top:16px; font-family:var(--font-mono); font-size:11px; color:var(--text-muted); letter-spacing:.12em; text-transform:uppercase;">Toegevoegd</div>
            <div style="margin-top:6px;">${KKUtil.formatDate(item.createdAt)}</div>
          </aside>
        </div>
      </section>
    `;
  }
</script>
</body>
</html>
