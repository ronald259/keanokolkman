<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Detail — Keano Kolkman</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
<div id="site-header"></div>
<main id="main"></main>
<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  if (!KKAuth.requireAuth()) { /* redirected */ } else {
    KKHeader.mount(null);
    KKFooter.mount();
    renderMedia();
  }

  function renderMedia() {
    const id = KKUtil.qs("id");
    const item = KK.byId(id);
    const main = document.getElementById("main");
    if (!item) {
      main.innerHTML = `
        <section class="container" style="padding-top:160px;">
          <span class="eyebrow">404</span>
          <h1>Item niet gevonden</h1>
          <p style="color:var(--text-dim); margin: 12px 0 24px;">Het item dat je zoekt bestaat niet of is verwijderd.</p>
          <a href="home.html" class="btn btn--outline">← Terug naar home</a>
        </section>`;
      return;
    }

    const cat = window.CATEGORIES[item.category];
    const isPhoto = item.category === "fotos";
    const related = KK.byCategory(item.category).filter(m => m.id !== item.id).slice(0, 8);

    const playerHTML = isPhoto
      ? `<figure class="container photo-viewer">
            <img src="${item.backdrop}" alt="${KKUtil.escapeHTML(item.title)}" />
         </figure>`
      : `<div class="container">
            <div class="player">
              <div class="player__placeholder" style="background-image:url('${item.backdrop}')" data-vimeo-id="${item.vimeoId || ""}">
                <button class="player__playbtn" id="play-btn" aria-label="Afspelen">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <span class="player__label">${item.vimeoId ? "VIMEO PRIVATE · KLIK OM AF TE SPELEN" : "VIDEO BRON ONTBREEKT"}</span>
              </div>
            </div>
         </div>`;

    main.innerHTML = `
      <section class="detail-hero">
        <div class="detail-hero__bg" style="background-image:url('${item.backdrop}')"></div>
        <div class="container detail-hero__inner">
          <div>
            <div class="detail-meta">
              <span class="pill">${KKUtil.escapeHTML(cat.label)}</span>
              <span>${KKUtil.escapeHTML(item.type)}</span>
              <span>${item.year}</span>
              <span>${KKUtil.escapeHTML(item.duration)}</span>
            </div>
            <h1 class="detail-title">${KKUtil.escapeHTML(item.title)}</h1>
            <p class="detail-desc">${KKUtil.escapeHTML(item.description)}</p>
            <div class="detail-actions">
              ${isPhoto
                ? `<a href="#viewer" class="btn btn--primary btn--lg"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 3h7v7H3z"/><path d="M14 3h7v7h-7z"/><path d="M3 14h7v7H3z"/><path d="M14 14h7v7h-7z"/></svg> Bekijk reeks</a>`
                : `<button id="play-cta" class="btn btn--primary btn--lg"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Afspelen</button>`}
              <a href="${item.category}.html" class="btn btn--outline btn--lg">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                Terug naar overzicht
              </a>
            </div>
          </div>
          <aside class="detail-aside" id="info">
            <dl>
              <dt>Type</dt><dd>${KKUtil.escapeHTML(item.type)}</dd>
              <dt>Categorie</dt><dd>${KKUtil.escapeHTML(cat.label)}</dd>
              <dt>Jaar</dt><dd>${item.year}</dd>
              <dt>Duur</dt><dd>${KKUtil.escapeHTML(item.duration)}</dd>
              <dt>Toegevoegd</dt><dd>${KKUtil.formatDate(item.createdAt)}</dd>
              <dt>Tags</dt>
              <dd>
                <div class="tags">
                  ${(item.tags||[]).map(t => `<span>#${KKUtil.escapeHTML(t)}</span>`).join("")}
                </div>
              </dd>
            </dl>
          </aside>
        </div>
      </section>

      <a id="viewer"></a>
      ${playerHTML}

      ${related.length ? `
        <section class="container" style="padding-top:60px;">
          <div class="row__head">
            <div class="row__title">
              <h2>Meer in ${KKUtil.escapeHTML(cat.label)}</h2>
              <span class="count">${related.length}</span>
            </div>
            <a class="row__more" href="${item.category}.html">Bekijk alles →</a>
          </div>
          <div class="grid ${item.category === 'fotos' ? 'grid--photos' : ''}">
            ${related.map(KKCard.html).join("")}
          </div>
        </section>` : ``}
    `;

    // Vimeo embed bij klik (lazy load).
    if (!isPhoto) {
      const placeholder = document.querySelector(".player__placeholder");
      const vimeoId = item.vimeoId;
      const swap = () => {
        if (!vimeoId) return;
        const wrap = document.querySelector(".player");
        wrap.innerHTML = `
          <iframe
            src="https://player.vimeo.com/video/${vimeoId}?autoplay=1&title=0&byline=0&portrait=0&dnt=1"
            style="width:100%;height:100%;border:0;"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen></iframe>`;
      };
      const playBtn = document.getElementById("play-btn");
      const cta = document.getElementById("play-cta");
      if (playBtn) playBtn.addEventListener("click", swap);
      if (placeholder) placeholder.addEventListener("click", swap);
      if (cta) cta.addEventListener("click", () => {
        document.getElementById("viewer").scrollIntoView({behavior:"smooth"});
        swap();
      });
    }
  }
</script>
</body>
</html>
