<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Keano Kolkman</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
<div id="site-header"></div>
<main id="main"></main>
<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  if (!KKAuth.requireAuth({ adminOnly: true })) { /* redirected */ } else {
    KKHeader.mount("admin");
    KKFooter.mount();
    renderAdmin();
  }

  function renderAdmin() {
    const main = document.getElementById("main");
    const all = window.MEDIA_LIBRARY;
    const stats = {
      total: all.length,
      published: all.filter(m => m.status === "published").length,
      drafts: all.filter(m => m.status !== "published").length,
      featured: all.filter(m => m.featured).length,
    };

    main.innerHTML = `
      <section class="container admin-shell">
        <div class="admin-head">
          <div>
            <span class="eyebrow">Adminomgeving</span>
            <h1>Mediabeheer</h1>
            <p style="color:var(--text-dim); margin-top: 8px;">Beheer films, animaties, foto's en projecten. Voeg toe, bewerk of verberg.</p>
          </div>
          <div style="display:flex; gap:10px;">
            <a href="admin-upload.html" class="btn btn--neon btn--lg">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14"/><path d="M5 12h14"/>
              </svg>
              Nieuw item
            </a>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="stat__label">Totaal items</div>
            <div class="stat__value">${stats.total}</div>
            <div class="stat__delta">${stats.published} gepubliceerd</div>
          </div>
          <div class="stat">
            <div class="stat__label">Concepten</div>
            <div class="stat__value">${stats.drafts}</div>
            <div class="stat__delta" style="color:var(--warn)">Verberg/publiceer</div>
          </div>
          <div class="stat">
            <div class="stat__label">Uitgelicht</div>
            <div class="stat__value">${stats.featured}</div>
            <div class="stat__delta">Op homepage</div>
          </div>
          <div class="stat">
            <div class="stat__label">Opslag (demo)</div>
            <div class="stat__value">0 GB</div>
            <div class="stat__delta">Video's via Vimeo</div>
          </div>
        </div>

        <div class="filterbar" style="margin-bottom:16px;">
          <div class="searchbar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-muted)"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="adm-search" type="search" placeholder="Zoek in titel of tag…" />
          </div>
          <button class="chip is-active" data-cat="all">Alles</button>
          <button class="chip" data-cat="films">Films</button>
          <button class="chip" data-cat="animaties">Animaties</button>
          <button class="chip" data-cat="fotos">Foto's</button>
          <button class="chip" data-cat="projecten">Projecten</button>
        </div>

        <div style="overflow-x:auto;">
          <table class="table" id="adm-table">
            <thead>
              <tr>
                <th>Titel</th>
                <th>Categorie</th>
                <th>Type</th>
                <th>Jaar</th>
                <th>Status</th>
                <th style="text-align:right;">Acties</th>
              </tr>
            </thead>
            <tbody id="adm-body"></tbody>
          </table>
        </div>
      </section>
    `;

    let cat = "all";
    const search = document.getElementById("adm-search");
    const body = document.getElementById("adm-body");

    function paint() {
      const q = (search.value || "").toLowerCase().trim();
      let arr = all.slice();
      if (cat !== "all") arr = arr.filter(m => m.category === cat);
      if (q) arr = arr.filter(m =>
        m.title.toLowerCase().includes(q) ||
        (m.tags||[]).some(t => t.toLowerCase().includes(q))
      );
      body.innerHTML = arr.map(m => `
        <tr>
          <td>
            <div class="row-title">
              <span class="thumb" style="background-image:url('${m.thumb}')"></span>
              <div>
                <strong>${KKUtil.escapeHTML(m.title)}</strong>
                <div style="color:var(--text-muted); font-size:12px;">${KKUtil.formatDate(m.createdAt)}</div>
              </div>
            </div>
          </td>
          <td>${KKUtil.escapeHTML((CATEGORIES[m.category]||{}).label || m.category)}</td>
          <td style="color:var(--text-dim);">${KKUtil.escapeHTML(m.type)}</td>
          <td>${m.year}</td>
          <td>
            ${m.status === "published"
              ? `<span class="badge badge--pub"><span class="dot" style="width:6px;height:6px;border-radius:999px;background:currentColor"></span> Gepubliceerd</span>`
              : `<span class="badge badge--draft">Concept</span>`}
          </td>
          <td>
            <div class="row-actions">
              <a href="media.html?id=${m.id}" class="btn-icon-sm" title="Bekijken">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </a>
              <a href="admin-edit.html?id=${m.id}" class="btn-icon-sm" title="Bewerken">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </a>
              <button class="btn-icon-sm danger" title="Verwijderen (demo)" onclick="alert('Demo: verwijderen wordt in de live versie pas definitief.')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
              </button>
            </div>
          </td>
        </tr>
      `).join("") || `<tr><td colspan="6" style="text-align:center; color:var(--text-muted); padding:40px;">Geen resultaten.</td></tr>`;
    }
    document.querySelectorAll("[data-cat]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("[data-cat]").forEach(b => b.classList.remove("is-active"));
        btn.classList.add("is-active");
        cat = btn.getAttribute("data-cat");
        paint();
      });
    });
    search.addEventListener("input", paint);
    paint();
  }
</script>
</body>
</html>
